id: FA1
title: Instrument Lifecycle & Maintenance
description: Calibration, procurement, lifecycle management and staff competence for observing instruments.
sub_domains:
- name: Calibration and Traceability
  sequence: 1
  chain_stage: Physical and Metrological Foundation
  levels:
  - score: 0
    label: Absent / Non-compliant
    standards_ref:
    - WMO-No. 8, Volume I, Chapter 1.5 and 1.6
    - WMO-No. 8, Volume V, Quality Management
    - ISO/IEC 17025:2017, Clauses 6.5 and 7.6
    - ISO 9001:2015, Clause 7.1.5
  - score: 1
    label: Basic / Ad hoc
    standards_ref:
    - WMO-No. 8, Volume I, Chapter 1.5 and 1.6
    - WMO-No. 8, Volume V, Quality Assurance
    - ISO 9001:2015, Clause 7.1.5
  - score: 2
    label: Structured / Partially Compliant
    standards_ref:
    - WMO-No. 8, Volume I, Chapter 1.5 and 1.6
    - WMO-No. 8, Volume III, Section 1.7.2
    - WMO-No. 8, Volume V
    - ISO/IEC 17025:2017, Clauses 6.5, 7.6 and 7.7
  - score: 3
    label: Compliant (Best Practice)
    standards_ref:
    - WMO-No. 8, Volume I, Chapter 1.5, 1.6 and Annex 1.B
    - WMO-No. 8, Volume III, Section 1.7.2
    - WMO-No. 8, Volume V, Quality Management
    - ISO/IEC 17025:2017, Clauses 6.5, 6.6, 7.6 and 7.7
    - ISO 9001:2015, Clauses 8, 9 and 10
  - score: 4
    label: Optimized / Continual Improvement
    standards_ref:
    - WMO-No. 8, Volume I, Annex 1.B
    - WMO-No. 8, Volume V, Quality Management and Continuous Improvement
    - Manual on WIGOS (WMO-No. 1160)
    - GCOS Climate Monitoring Principles
    - ISO 9001:2015, Clauses 9 and 10
  elements:
  - id: interval_definition
    title: Calibration Interval Definition & Schedule Management
    weight: 1.0
    level_text:
      0: No documented calibration programme, calibration schedule or calibration intervals are defined
      1: Calibration intervals are based mainly on manufacturer recommendations or local expert judgement
      2: Calibration intervals are documented for major sensor types and maintained in a calibration or
        asset system
      3: Calibration intervals are justified using manufacturer guidance, operational experience, historical
        performance and risk considerations
      4: Calibration intervals are adjusted using objective evidence while maintaining traceability and
        observation quality requirements
    gates:
    - requires: traceability
      min_level: 3
      applies_at_level: 4
  - id: tracking_management
    title: Calibration Tracking & Asset Management
    weight: 1.0
    level_text:
      1: Calibration activities are tracked manually or reactively, with inconsistent control of overdue
        calibrations
      2: Calibration schedules are monitored and calibration records are retained for critical operational
        instruments
      3: Calibration status is managed through a controlled asset or calibration management process with
        high on-time completion
      4: Calibration strategy is actively optimized using sensor drift analysis, operational performance,
        internal research and calibration history
  - id: traceability
    title: Metrological Traceability
    weight: 1.0
    level_text:
      0: Metrological traceability to reference standards, national standards or accredited laboratories
        cannot be demonstrated
      1: Traceability is partially understood but not consistently documented or reviewed
      2: Traceability is documented through reference standards, secondary standards or accredited external
        providers
      3: SI traceability is demonstrated through accredited laboratories, recognized reference standards
        or documented traceability chains
  - id: records_certificates
    title: Calibration Records & Certificates
    weight: 1.0
    level_text:
      0: Calibration records, certificates and calibration histories are incomplete, unavailable or not
        retained
      1: Calibration certificates are retained for some instruments but are not systematically assessed
        for fitness-for-purpose
      2: Calibration certificates are reviewed and retained, including relevant calibration conditions
        and results
  - id: uncertainty
    title: Measurement Uncertainty Evaluation
    weight: 1.0
    level_text:
      0: Measurement uncertainty is not evaluated for calibration activities or sensor types
      2: Basic uncertainty estimates or uncertainty budgets exist for selected sensor types or calibration
        procedures
      3: Uncertainty budgets are maintained for relevant calibration procedures and reviewed when methods
        or equipment change
      4: Uncertainty budgets and calibration methods are periodically validated and improved using new
        evidence or intercomparison results
  - id: field_verification
    title: As-Found Calibration & Field Verification
    weight: 1.0
    level_text:
      0: As-found calibration, functional testing and field verification are not performed systematically
      1: As-found calibration and post-maintenance verification are performed only for selected cases.
        Field checks or functional tests occur occasionally but are not governed by standard procedures
      2: Field verification and functional testing procedures are implemented for selected instruments
        or station visits
      3: As-found calibration is systematically performed before adjustment or correction where needed
        to support data quality assessment. Field verification, functional testing and data logger verification
        are documented and consistently applied as part of operational control
      4: Field verification data are used to detect gradual sensor degradation and inform maintenance,
        calibration and replacement decisions
  - id: drift_monitoring
    title: Drift, Bias & Long-Term Trend Monitoring
    weight: 1.0
    level_text:
      0: Sensor drift, bias or long-term calibration trends are not monitored or reviewed
      2: Calibration history is available for critical sensors and used to identify major outliers or
        recurring issues
      3: Calibration drift, bias and historical performance are reviewed for critical sensors and sensor
        categories
      4: Long-term drift and bias analysis is performed at instrument, station and network level where
        relevant. Network-wide calibration performance indicators are monitored and reviewed to identify
        systematic risks or improvement needs. Calibration outcomes are integrated into lifecycle management,
        procurement, maintenance and continual improvement processes
- name: Procurement
  sequence: 2
  chain_stage: Physical and Metrological Foundation
  levels:
  - score: 0
    label: Absent / Non-compliant
    standards_ref:
    - WMO-No. 8, Volume I, Chapter 1.4 and 1.6
    - WMO-No. 8, Volume III, Chapter 1
    - ISO 9001:2015, Clause 8.4
  - score: 1
    label: Basic / Ad hoc
    standards_ref:
    - WMO-No. 8, Volume I, General requirements of instruments
    - WMO-No. 8, Volume III, Automatic Weather Stations
    - ISO 9001:2015, Clause 8.4
  - score: 2
    label: Structured / Partially Compliant
    standards_ref:
    - WMO-No. 8, Volume I, Chapter 1.4 and 1.6
    - WMO-No. 8, Volume III, Chapter 1
    - Manual on WIGOS (WMO-No. 1160)
    - ISO 9001:2015, Clause 8.4
  - score: 3
    label: Compliant (Best Practice)
    standards_ref:
    - WMO-No. 8, Volume I, Chapter 1.4 and Annex 1.A
    - WMO-No. 8, Volume III, Chapter 1
    - Manual on WIGOS (WMO-No. 1160)
    - ISO 9001:2015, Clauses 8.4 and 8.5
    - GCOS Climate Monitoring Principles
  - score: 4
    label: Optimized / Continual Improvement
    standards_ref:
    - Manual on WIGOS (WMO-No. 1160)
    - WMO-No. 8, Volume III, Observing Systems
    - GCOS Climate Monitoring Principles
    - ISO 9001:2015, Clauses 9 and 10
  elements:
  - id: requirements_and_guidance
    title: Observing Requirements & Standards Alignment
    weight: 1.0
    level_text:
      0: Procurement decisions are made without documented observing, user or technical requirements. WMO
        guidance, international standards and application needs are not considered during procurement.
      1: User requirements are considered informally and are not consistently translated into measurable
        specifications.
      2: Procurement procedures are documented and consistently applied for major sensor, station or data
        logger purchases. User requirements, applicable WMO guidance and operational constraints are considered
        when preparing specifications. Procurement records support traceability from requirements to selected
        technical solution.
      3: Procurement specifications are derived from documented observing requirements, user needs, WMO
        guidance and operational constraints.
  - id: measurement_specification
    title: Technical & Measurement Specification
    weight: 1.0
    level_text:
      0: Instrument performance requirements such as range, accuracy, uncertainty or resolution are not
        formally specified.
      1: Basic technical specifications are defined for selected procurements but vary between projects
        or networks.
      2: Specifications include key measurement requirements such as range, accuracy, resolution and operating
        conditions.
      3: Specifications include measurement range, accuracy, uncertainty, resolution, sampling or averaging
        requirements and environmental conditions.
      4: Specifications are periodically updated using operational experience, QC findings, maintenance
        outcomes and research insights.
  - id: non_functional_requirements
    title: Non-Functional Requirements
    weight: 1.0
    level_text:
      1: Non-functional requirements such as reliability, maintainability, power management or availability
        are considered inconsistently.
      3: Non-functional requirements such as availability, reliability, maintainability, power supply and
        communications are included where relevant.
  - id: supplier_evaluation
    title: Supplier Evaluation & Market Engagement
    weight: 1.0
    level_text:
      0: Supplier selection is primarily cost-driven and not supported by structured technical evaluation.
      1: Procurement relies heavily on supplier information, previous practice or individual technical
        judgement.
      2: Supplier evaluations and technical assessments are documented and retained.
      3: Market engagement, technical research, pre-qualification testing or field trials are used for
        significant procurements.
      4: Structured technology scouting, market engagement and field trials are used to identify suitable
        future observing solutions. Supplier and system performance are monitored using defined indicators
        and lessons learned are captured.
  - id: acceptance_verification
    title: Acceptance Testing & Verification
    weight: 1.0
    level_text:
      0: Acceptance testing, verification and validation before operational deployment are absent or undocumented.
      1: Acceptance checks are performed case by case and are not governed by a standard process.
      2: Factory acceptance, site acceptance or internal verification activities are applied for critical
        systems.
      3: Factory Acceptance Tests, Site Acceptance Tests and internal verification and validation are defined
        before operational acceptance. Third-party delivered systems are subject to documented acceptance
        criteria and organizational verification.
      4: Acceptance test results and operational experience are used to improve future procurement specifications
        and evaluation criteria.
  - id: strategic_integration
    title: Strategic & Lifecycle Integration
    weight: 1.0
    level_text:
      3: Procurement decisions consider lifecycle cost, operational risk and impact on observation quality.
      4: Procurement strategy is integrated with observing network strategy, lifecycle planning and long-term
        service requirements. Procurement decisions explicitly assess impacts on long-term continuity,
        homogeneity and network representativeness where relevant. Procurement outcomes support continual
        improvement of observing capability and data quality.
- name: Lifecycle Mgmt and Replacement
  sequence: 3
  chain_stage: Physical and Metrological Foundation
  levels:
  - score: 0
    label: Absent / Non-compliant
    standards_ref:
    - WMO-No. 8, Volume I, Metadata and homogeneity
    - WIGOS Metadata Standard (WMO-No. 1192)
    - Manual on WIGOS (WMO-No. 1160)
  - score: 1
    label: Basic / Ad hoc
    standards_ref:
    - WMO-No. 8, Volume I and III
    - WIGOS Metadata Standard (WMO-No. 1192)
  - score: 2
    label: Structured / Partially Compliant
    standards_ref:
    - WIGOS Metadata Standard (WMO-No. 1192), Categories 3, 5 and 8
    - Manual on WIGOS (WMO-No. 1160)
    - WMO-No. 8, Volume I, Chapter 1.3.4
  - score: 3
    label: Compliant (Best Practice)
    standards_ref:
    - WMO-No. 8, Volume I, Chapter 1.3.4
    - WMO-No. 8, Volume III, Observing Systems
    - WIGOS Metadata Standard (WMO-No. 1192)
    - Manual on WIGOS (WMO-No. 1160)
    - GCOS Climate Monitoring Principles
  - score: 4
    label: Optimized / Continual Improvement
    standards_ref:
    - Manual on WIGOS (WMO-No. 1160)
    - WIGOS Metadata Standard (WMO-No. 1192)
    - GCOS Climate Monitoring Principles
    - WMO-No. 8, Volume I and III
    - ISO 9001:2015, Clauses 9 and 10
  elements:
  - id: asset_identification_repository
    title: Asset Identification & Repository
    weight: 1.0
    level_text:
      0: Instruments, sensors, data loggers and components are not uniquely identifiable throughout their
        lifecycle. No central asset repository or controlled inventory exists for operational observing
        assets.
      1: Basic asset records exist but completeness varies across networks, stations or equipment categories.
      2: A central asset repository is maintained for major observing assets, including unique identifiers
        and deployment information.
      3: Asset repository includes serial number, deployment history, calibration history, maintenance
        history, firmware or hardware version and lifecycle status.
  - id: history_tracking
    title: Lifecycle History & Traceability Recording
    weight: 1.0
    level_text:
      0: Deployment history, calibration status, maintenance history and lifecycle status are not reliably
        recorded.
      1: Unique identifiers are used for many assets but lifecycle traceability is incomplete.
      2: Calibration history, maintenance events, firmware or hardware versions and lifecycle status are
        recorded for critical assets. Replacement records support traceability between asset changes and
        observing records.
  - id: replacement_planning
    title: Replacement Planning
    weight: 1.0
    level_text:
      0: Replacement decisions are reactive and based mainly on failures or immediate operational need.
      1: Replacement planning is mainly reactive and driven by failure, obsolescence or local operational
        experience.
      2: Replacement planning exists for key sensor categories and major observing systems.
      3: Replacement planning is based on lifecycle expectations, performance history, operational requirements
        and risk.
      4: Replacement planning considers technological developments, user requirements, performance analytics
        and network evolution. Asset performance analytics are used to forecast replacement needs and
        reduce operational risk.
  - id: continuity_impact_management
    title: Continuity & Impact Management
    weight: 1.0
    level_text:
      0: Instrument replacement impacts on observations, metadata and climate continuity are not assessed.
      1: Hybrid operation of multiple sensor types is managed case by case. Parallel measurements, intercomparisons
        or impact assessments are used inconsistently.
      2: Hybrid operation of different sensor types is documented and managed for selected measurands.
      3: Hybrid sensor operation is formally managed to protect data consistency across sensor types and
        manufacturers. Intercomparison or parallel measurement campaigns are performed when continuity
        or homogeneity may be affected. Impacts on operational products, climate records and users are
        assessed before implementation.
      4: Intercomparison and overlap studies are designed to support transfer functions, homogenization
        or impact assessment where needed. Lifecycle decisions explicitly support long-term continuity,
        homogeneity and fitness-for-purpose of observational records.
  - id: decommissioning_control
    title: Decommissioning Control
    weight: 1.0
    level_text:
      0: Decommissioning controls are absent and retired instruments may re-enter service unintentionally.
      1: Decommissioned instruments are recorded locally but controls to prevent reuse are limited.
      2: Formal decommissioning procedures exist and asset status is updated after retirement or replacement.
      3: Decommissioned instruments are removed from operational inventories and prevented from re-entering
        service.
  - id: replacement_verification
    title: Replacement Verification & Deployment
    weight: 1.0
    level_text:
      2: Verification testing is performed before operational deployment of replacement sensors or data
        loggers.
      3: Laboratory or field verification is performed before large-scale deployment of replacement sensors
        or systems.
      4: Results from replacement projects are incorporated into operational processing, metadata records
        and user communication.
  - id: strategic_integration
    title: Strategic Lifecycle Integration
    weight: 1.0
    level_text:
      4: Lifecycle management is integrated with observing network strategy, investment planning and long-term
        observing objectives. Lessons learned are systematically used to improve future replacement, procurement
        and maintenance strategies.
- name: Sensor and Station Maintenance
  sequence: 4
  chain_stage: Network Infrastructure and Field Maintenance
  levels:
  - score: 0
    label: Absent / Non-compliant
    standards_ref:
    - WMO-No. 8, Volume III, Section 1.7
    - WMO-No. 8, Volume V, Quality Assurance
  - score: 1
    label: Basic / Ad hoc
    standards_ref:
    - WMO-No. 8, Volume III, Section 1.7
    - WMO-No. 8, Volume V
    - ISO 9001:2015
  - score: 2
    label: Structured / Partially Compliant
    standards_ref:
    - WMO-No. 8, Volume III, Sections 1.5 and 1.7
    - WMO-No. 8, Volume V, Quality Management
    - WMO-No. 1269
    - ISO 9001:2015
  - score: 3
    label: Compliant (Best Practice)
    standards_ref:
    - WMO-No. 8, Volume III, Sections 1.5, 1.7 and 1.7.1
    - WMO-No. 8, Volume V, Quality Assurance and Management
    - WMO-No. 1269
    - ISO 9001:2015, Clauses 8, 9 and 10
  - score: 4
    label: Optimized / Continual Improvement
    standards_ref:
    - WMO-No. 8, Volume III, Observing Systems Management
    - WMO-No. 8, Volume V, Continuous Improvement
    - WMO-No. 1269
    - ISO 9001:2015, Clauses 9 and 10
  elements:
  - id: maintenance_programme
    title: Preventive Maintenance Programme & Governance
    weight: 1.0
    level_text:
      0: No documented preventive or corrective maintenance programme exists for sensors, stations or
        networks. Maintenance is primarily reactive and initiated only after failures or user complaints.
        Responsibilities for maintenance activities and follow-up actions are unclear.
      1: Basic preventive maintenance activities are performed but intervals are not consistently justified.
        Maintenance intervals are based mainly on manufacturer guidance or local operational experience.
      2: Preventive maintenance schedules are documented for major sensor, station and network types.
      3: Preventive maintenance programme is based on operational requirements, parameter criticality,
        historical performance and risk.
      4: Maintenance intervals and strategies are optimized using performance trends, failure analysis
        and operational experience. Maintenance planning is integrated with calibration, lifecycle management
        and network performance monitoring.
  - id: record_keeping
    title: Maintenance Record Keeping
    weight: 1.0
    level_text:
      0: Maintenance visits, findings and corrective actions are not reliably recorded.
      2: Maintenance visits are recorded and actions from inspections are tracked to closure. Maintenance
        information is available to relevant internal stakeholders.
      3: Maintenance history is available at station and sensor level and supports calibration, lifecycle
        and quality management.
  - id: fault_management
    title: Fault Reporting & Corrective Action Management
    weight: 1.0
    level_text:
      0: No formal fault reporting, escalation or resolution process exists.
      1: Faults are reported through informal or manual channels. Corrective actions are tracked inconsistently
        and closure is not always verified.
      2: Fault reporting systems, manual reports or automated alerts are routinely used. Escalation procedures
        are defined for critical failures or service-impacting issues.
      3: Corrective maintenance follows defined workflows with escalation pathways, target response times
        and resolution tracking.
  - id: performance_monitoring
    title: Station & Sensor Performance Monitoring
    weight: 1.0
    level_text:
      0: Station or sensor performance is not monitored systematically.
      1: Monitoring of station performance relies largely on staff knowledge or manual review.
      2: Basic station or sensor monitoring supports prioritization of corrective maintenance.
      3: Automatic monitoring, QC flags, system alarms or ticketing systems are integrated into maintenance
        workflows.
      4: Predictive or condition-based maintenance approaches are applied where technically and operationally
        appropriate.
  - id: contractor_management
    title: Contractor & Service Provider Management
    weight: 1.0
    level_text:
      1: Contractor maintenance activities are used where needed but service expectations are not consistently
        specified.
      2: Service providers are managed through documented agreements where applicable.
      3: Contractor performance is managed through SLAs and periodically reviewed against service expectations.
      4: SLA performance and maintenance effectiveness are reviewed using defined improvement targets.
  - id: maintenance_effectiveness_tracking
    title: Maintenance Effectiveness & Reliability Indicators
    weight: 1.0
    level_text:
      3: Maintenance completion rates, overdue actions and fault resolution are monitored and reported.
      4: Network-wide reliability indicators such as availability, downtime, recurrence and response times
        are analysed.
  - id: root_cause_analysis
    title: Root Cause Analysis & Continuous Improvement
    weight: 1.0
    level_text:
      3: Root cause analysis is performed for significant, recurring or service-impacting failures.
      4: Root cause analysis outcomes are systematically used to improve procedures, training and system
        design. Lessons learned are captured and used to improve observing system reliability and service
        continuity.
- name: Staff Competence and Training
  sequence: 5
  chain_stage: Network Infrastructure and Field Maintenance
  levels:
  - score: 0
    label: Absent / Non-compliant
    standards_ref:
    - WMO Technical Regulations (WMO-No. 49), Part V
    - ISO 9001:2015, Clause 7.2
    - ISO/IEC 17025:2017, Clause 6.2
  - score: 1
    label: Basic / Ad hoc
    standards_ref:
    - WMO Technical Regulations (WMO-No. 49), Part V
    - ISO 9001:2015, Clause 7.2
  - score: 2
    label: Structured / Partially Compliant
    standards_ref:
    - WMO Technical Regulations (WMO-No. 49), Part V
    - ISO 9001:2015, Clause 7.2
    - ISO/IEC 17025:2017, Clause 6.2
  - score: 3
    label: Compliant (Best Practice)
    standards_ref:
    - WMO Technical Regulations (WMO-No. 49), Part V
    - WMO-No. 8, Volume V, Quality Management
    - ISO 9001:2015, Clause 7.2
    - ISO/IEC 17025:2017, Clause 6.2
  - score: 4
    label: Optimized / Continual Improvement
    standards_ref:
    - WMO Technical Regulations (WMO-No. 49), Part V
    - WMO-No. 8, Volume V, Quality Management and Continual Improvement
    - ISO 9001:2015, Clauses 7.2, 9 and 10
    - ISO/IEC 17025:2017, Clause 6.2
  elements:
  - id: competency_framework
    title: Competency Framework & Role Definition
    weight: 1.0
    level_text:
      0: No documented training programme or competence framework exists for relevant technical and operational
        roles. Roles, responsibilities and required competences are not formally defined.
      2: Competence requirements are defined for critical functions and activities.
      3: Competency framework is established for relevant technical, observational and operational roles.
        Personnel are formally authorized for specific technical or calibration-related activities where
        appropriate.
  - id: training_delivery
    title: Training Delivery & Onboarding
    weight: 1.0
    level_text:
      1: Training is provided mainly through informal knowledge transfer or on-the-job experience. Training
        needs are identified reactively or by individual supervisors. Onboarding arrangements exist for
        some roles but are not standardized.
      2: Training plans are documented for new staff and selected operational or technical roles. Refresher
        training is provided for selected procedures, systems or safety-critical activities.
      3: Training plans cover onboarding, refresher training and professional development needs.
      4: Lessons learned from incidents, audits and operational reviews are incorporated into training
        programmes.
  - id: assessment_and_records
    title: Competence Assessment & Training Records
    weight: 1.0
    level_text:
      0: Competence assessments are not performed or recorded. Training records are incomplete or unavailable.
      1: Competence is assessed informally and records are incomplete.
      2: Training records and initial competence assessments are maintained centrally.
      3: Competence assessments are conducted periodically and documented. Training effectiveness is reviewed
        and training content is updated when procedures, systems or standards change.
      4: Competence metrics and training indicators are monitored and reviewed.
  - id: succession_continuity
    title: Succession Planning & Workforce Continuity
    weight: 1.0
    level_text:
      0: Succession planning and workforce continuity are not addressed.
      1: Dependence on key individuals creates operational continuity risks.
      2: Basic succession planning exists for critical specialist roles. Workforce risks are considered
        for selected operational capabilities.
      3: Succession planning is maintained for critical technical and operational functions.
      4: Knowledge management supports retention and transfer of critical expertise. Succession planning
        is linked to workforce planning, retirement forecasting and future capability needs.
  - id: contractor_competence
    title: Contractor & Subcontractor Competence
    weight: 1.0
    level_text:
      0: Competence requirements for subcontractor staff are not defined.
      1: Contractor competence is assessed mainly during procurement or based on supplier assurance.
      2: Contractor competence requirements are specified for relevant outsourced activities.
      3: Contractor competence is verified and periodically reviewed before work on operational systems.
      4: Contractor competence performance is monitored and used to improve outsourcing and service management.
  - id: strategic_workforce_development
    title: Strategic Workforce Development
    weight: 1.0
    level_text:
      4: Workforce development is integrated with long-term organizational strategy and observing system
        evolution. Competency gaps are proactively identified using workforce and capability analysis.
